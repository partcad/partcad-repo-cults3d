# PartCAD package: Cults3D creations as parts, served by a repository plugin.
#
# Published as //pub/collection/cults3d/models: this package is
# //pub/collection/cults3d, and its one external dependency 'models' is served by
# the cults3d_repo plugin. Nothing is listed - a model site's catalog is not
# something to enumerate - so a part is asked for by name, and found with
# 'pc search parts' (see the README).
name: //pub/collection/cults3d

desc: |
  Creations on Cults3D (https://cults3d.com) as PartCAD parts, by the
  creation's slug. Cults3D's API gives a creation's files to its creator only,
  so your own creations are parts, a part per file, and everyone else's are
  found by 'pc search parts' with where to get them. Every question needs your
  Cults3D nick and an API key: 'pc login //pub/collection/cults3d:cults3d_repo'.
  No geometry is vendored; every file is fetched from Cults3D when it is first
  built.
url: https://cults3d.com/

# The first PartCAD that has the toolkit this plugin is written with
# (plugin_models), and hands a repository plugin the key it is asked for
# taken apart ('query').
partcad: ">=0.9.20"

# An upload to a model site says nothing about whether, or how, it is made to
# be manufactured. The plugin says the same of 'models' in its metadata.
manufacturable: false

docs:
  name: Cults3D for PartCAD
  usage: |
    ```shell
    pc login //pub/collection/cults3d:cults3d_repo
    pc search parts -P //pub/collection/cults3d/models -k "cable clip"
    pc inspect //pub/collection/cults3d/models:<your creation's slug>
    pc inspect "//pub/collection/cults3d/models:<your creation's slug>;format=stl"
    ```

dependencies:
  models:
    type: external
    plugin: :cults3d_repo
    desc: Cults3D creations, a part per file of your own.

repositories:
  cults3d_repo:
    type: basic
    path: cults3d_repo.py
    desc: Serves your Cults3D creations as parts, and searches Cults3D.
    # Every parameter here is a default for every Cults3D part, and yours
    # to change without touching this package, two ways:
    #
    # - in your own ~/.partcad/config.yaml, under 'parameters', by the
    #   plugin's name - which is also where 'pc login' keeps these two:
    #
    #     parameters:
    #       //pub/collection/cults3d:cults3d_repo:
    #         formats: stl,3mf
    #
    # - or in a package of your own, as an enrich of the plugin and a package
    #   it serves, whose parts are then yours to name - '//cults3d_meshes:<creation>'
    #   in a package at the root (never with credentials: those are yours,
    #   not a package's):
    #
    #     repositories:
    #       meshes_repo:
    #         type: enrich
    #         source: //pub/collection/cults3d:cults3d_repo
    #         with:
    #           formats: stl,3mf
    #     dependencies:
    #       cults3d_meshes:
    #         type: external
    #         plugin: :meshes_repo
    #
    # A part's own parameters override these for that part. Every part takes
    # 'file' (one of the creation's files, by name ('<name>#2' for the second
    # of that name)), 'format' (its best file of that format: one of the
    # 'formats' below) and 'source' (as below) - in its name, '<your
    # creation's slug>;format=stl', or in the 'with' of an enrich of the part:
    #
    #     parts:
    #       clip:
    #         type: enrich
    #         source: //pub/collection/cults3d/models:<your creation's slug>
    #         with:
    #           format: stl
    parameters:
      formats:
        type: string
        default: ""
        desc: >-
          The formats to take a creation in, best first, separated by commas:
          step, brep, iges, 3mf, stl, obj, glb, usd, sldprt, ipt,
          catpart, f3d, fcstd, sat, pvz, scad. A format left out is
          not taken
          - 'stl,3mf' is meshes only - unless a part asks for it by its own
          'format' or 'file'. Empty is all of them, in that order.
      source:
        type: string
        default: auto
        enum: [auto, original, preview]
        desc: >-
          Which of a creation's files. Cults3D has no preview meshes of its
          own: every file is the designer's, so 'auto' and 'original' are the
          same here, and 'preview' finds nothing.
      # Empty here, and meant to stay so: a credential is the user's own, and
      # is set where only they see it.
      nick:
        type: string
        default: ""
        desc: >-
          The nick of your Cults3D account - the name your profile is under,
          not your e-mail address. Cults3D's API signs in with it and an API
          key, the only way it has. 'pc login
          //pub/collection/cults3d:cults3d_repo' asks for both, checks them, and
          keeps them in your ~/.partcad/config.yaml, under 'parameters' as
          above; 'pc login --agent' says where to find them, and takes them
          back with '--set nick=... --set api_key=...'. CULTS3D_NICK gives it
          too, where the plugin's sandbox sees the environment (a container
          does not).
      api_key:
        type: string
        default: ""
        desc: >-
          An API key of that account, made at https://cults3d.com/en/api/keys
          (a read-only one is enough), kept as 'nick' is; CULTS3D_API_KEY gives
          it too. The API hands over the files of the account's own creations
          only. Never set it in a package.
